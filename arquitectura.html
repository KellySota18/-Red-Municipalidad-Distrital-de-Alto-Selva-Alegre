
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arquitectura general del sistema</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        background: #eef2f7;
        font-family: "Segoe UI", Arial, sans-serif;
    }

    .wrap {
        width: min(100%, 1600px);
        margin: 0 auto;
        padding: 15px;
        background: #ffffff;
        color: #142b45;
    }

    svg {
        display: block;
        width: 100%;
        height: auto;
        background: #ffffff;
    }

    .titulo {
        font-size: 34px;
        font-weight: 700;
        fill: #173454;
        letter-spacing: .2px;
    }

    .subtitulo {
        font-size: 17px;
        fill: #536b85;
    }

    .capa-titulo {
        font-size: 19px;
        font-weight: 700;
    }

    .numero {
        font-size: 20px;
        font-weight: 700;
        fill: #ffffff;
        text-anchor: middle;
        dominant-baseline: middle;
    }

    .caja {
        fill: #ffffff;
        stroke-width: 2;
        rx: 13;
    }

    .caja-titulo {
        font-size: 19px;
        font-weight: 700;
        fill: #111827;
        text-anchor: middle;
    }

    .caja-texto {
        font-size: 15px;
        fill: #43566d;
        text-anchor: middle;
    }

    .caja-secundario {
        font-size: 13px;
        fill: #66788d;
        text-anchor: middle;
    }

    .flujo-texto {
        font-size: 14px;
        font-weight: 600;
    }

    .flujo-secundario {
        font-size: 13px;
    }

    .leyenda-texto {
        font-size: 14px;
        fill: #334155;
    }

    .nota {
        font-size: 12px;
        fill: #64748b;
    }
</style>
</head>

<body>

<div class="wrap">

<svg viewBox="0 0 1600 1000"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     aria-label="Diagrama de arquitectura general del sistema de inventario y seguridad de red">

    <defs>

        <!-- Flecha general -->
        <marker id="arrowGray"
                markerWidth="12"
                markerHeight="12"
                refX="10"
                refY="6"
                orient="auto">
            <path d="M0,0 L12,6 L0,12 Z" fill="#38506b"/>
        </marker>

        <!-- Flecha azul -->
        <marker id="arrowBlue"
                markerWidth="12"
                markerHeight="12"
                refX="10"
                refY="6"
                orient="auto">
            <path d="M0,0 L12,6 L0,12 Z" fill="#1768b3"/>
        </marker>

        <!-- Flecha verde -->
        <marker id="arrowGreen"
                markerWidth="12"
                markerHeight="12"
                refX="10"
                refY="6"
                orient="auto">
            <path d="M0,0 L12,6 L0,12 Z" fill="#21804c"/>
        </marker>

        <!-- Flecha naranja -->
        <marker id="arrowOrange"
                markerWidth="12"
                markerHeight="12"
                refX="10"
                refY="6"
                orient="auto">
            <path d="M0,0 L12,6 L0,12 Z" fill="#d17a00"/>
        </marker>

        <!-- Flecha gris oscuro -->
        <marker id="arrowDark"
                markerWidth="12"
                markerHeight="12"
                refX="10"
                refY="6"
                orient="auto">
            <path d="M0,0 L12,6 L0,12 Z" fill="#475569"/>
        </marker>

    </defs>

    <!-- ================================================= -->
    <!-- ENCABEZADO -->
    <!-- ================================================= -->

    <text x="800" y="55"
          text-anchor="middle"
          class="titulo">
        Arquitectura general del sistema
    </text>

    <text x="800" y="91"
          text-anchor="middle"
          class="subtitulo">
        Sistema de Inventario y Seguridad de Red ·
        Municipalidad Distrital de Alto Selva Alegre · v1.0
    </text>


    <!-- ================================================= -->
    <!-- CAPA 1: USUARIOS Y CANALES DE ACCESO -->
    <!-- ================================================= -->

    <rect x="30" y="120"
          width="1540" height="150"
          rx="17"
          fill="#f1f6fb"
          stroke="#d5e2ef"
          stroke-width="1.5"/>

    <!-- Encabezado de capa -->

    <circle cx="70" cy="154" r="21" fill="#164b8e"/>

    <text x="70" y="154" class="numero">1</text>

    <text x="105" y="161"
          class="capa-titulo"
          fill="#174578">
        Usuarios y canales de acceso
    </text>


    <!-- Rol consulta -->

    <rect class="caja"
          x="65" y="180"
          width="300" height="70"
          stroke="#91abc6"/>

    <text x="215" y="207" class="caja-titulo">
        Rol CONSULTA
    </text>

    <text x="215" y="231" class="caja-texto">
        Consulta inventario, VLAN y subredes
    </text>


    <!-- Rol técnico -->

    <rect class="caja"
          x="390" y="180"
          width="300" height="70"
          stroke="#91abc6"/>

    <text x="540" y="207" class="caja-titulo">
        Rol TÉCNICO
    </text>

    <text x="540" y="231" class="caja-texto">
        Programa y actualiza mantenimientos
    </text>


    <!-- Rol administrador -->

    <rect class="caja"
          x="715" y="180"
          width="300" height="70"
          stroke="#91abc6"/>

    <text x="865" y="207" class="caja-titulo">
        Rol ADMINISTRADOR
    </text>

    <text x="865" y="231" class="caja-texto">
        Usuarios, equipos y seguridad de red
    </text>


    <!-- Administrador DBA -->

    <rect class="caja"
          x="1040" y="180"
          width="495" height="70"
          stroke="#91abc6"/>

    <text x="1287" y="207" class="caja-titulo">
        Administrador de la base de datos (DBA)
    </text>

    <text x="1287" y="231" class="caja-texto">
        Instalación, respaldo, restauración y pgAdmin 4
    </text>



    <!-- ================================================= -->
    <!-- CAPA 2: PRESENTACIÓN / CLIENTE -->
    <!-- ================================================= -->

    <rect x="30" y="290"
          width="1540" height="190"
          rx="17"
          fill="#f3f8f3"
          stroke="#d7e8d9"
          stroke-width="1.5"/>

    <circle cx="70" cy="325" r="21" fill="#207447"/>

    <text x="70" y="325" class="numero">2</text>

    <text x="105" y="332"
          class="capa-titulo"
          fill="#286b41">
        Capa de presentación / cliente
    </text>


    <!-- Estación de trabajo -->

    <rect class="caja"
          x="65" y="350"
          width="520" height="105"
          stroke="#85b28e"/>

    <text x="325" y="378" class="caja-titulo">
        Estación de trabajo Windows 10/11
    </text>

    <text x="325" y="405" class="caja-texto">
        PowerShell 7 / Windows PowerShell 5.1
    </text>

    <text x="325" y="429" class="caja-texto">
        Módulo RedCli.psm1 (Connect-Red, Get-Red...)
    </text>

    <text x="325" y="448" class="caja-secundario">
        No contempla interfaz web ni aplicación móvil
    </text>


    <!-- Navegador -->

    <rect class="caja"
          x="615" y="350"
          width="390" height="105"
          stroke="#85b28e"/>

    <text x="810" y="378" class="caja-titulo">
        Navegador (solo administración)
    </text>

    <text x="810" y="405" class="caja-texto">
        pgAdmin 4 → PostgreSQL
    </text>

    <text x="810" y="429" class="caja-texto">
        Edge / Chrome / Firefox actualizados
    </text>

    <text x="810" y="448" class="caja-secundario">
        Acceso directo restringido a la LAN
    </text>


    <!-- Herramientas ACL -->

    <rect class="caja"
          x="1035" y="350"
          width="500" height="105"
          stroke="#85b28e"/>

    <text x="1285" y="378" class="caja-titulo">
        Herramientas de ACL
    </text>

    <text x="1285" y="405" class="caja-texto">
        Node.js 20 · simulador · generador de configuración
    </text>

    <text x="1285" y="429" class="caja-texto">
        Cisco Packet Tracer (pruebas manuales)
    </text>

    <text x="1285" y="448" class="caja-secundario">
        Equipo del responsable de red
    </text>



    <!-- ================================================= -->
    <!-- FLUJOS ENTRE PRESENTACIÓN Y APLICACIÓN -->
    <!-- ================================================= -->

    <!-- Estación de trabajo hacia API -->

    <line x1="325" y1="455"
          x2="325" y2="600"
          stroke="#1768b3"
          stroke-width="3"
          marker-end="url(#arrowBlue)"/>

    <text x="342" y="493"
          class="flujo-texto"
          fill="#1768b3">
        HTTPS / HTTP + cookies
    </text>

    <text x="342" y="514"
          class="flujo-secundario"
          fill="#1768b3">
        API REST (JSON)
    </text>


    <!-- Navegador hacia base de datos -->

    <path d="M810 455
             L810 735
             L700 735
             L700 830"
          fill="none"
          stroke="#21804c"
          stroke-width="3"
          stroke-linejoin="round"
          marker-end="url(#arrowGreen)"/>

    <text x="830" y="493"
          class="flujo-texto"
          fill="#21804c">
        SQL directo (5432)
    </text>

    <text x="830" y="514"
          class="flujo-secundario"
          fill="#21804c">
        Solo red administrativa
    </text>


    <!-- Herramientas ACL hacia servicios -->

    <line x1="1285" y1="455"
          x2="1285" y2="600"
          stroke="#d17a00"
          stroke-width="3"
          marker-end="url(#arrowOrange)"/>

    <text x="1305" y="493"
          class="flujo-texto"
          fill="#bd6b00">
        Configuración IOS
    </text>

    <text x="1305" y="514"
          class="flujo-secundario"
          fill="#bd6b00">
        Generación y envío de resultados
    </text>



    <!-- ================================================= -->
    <!-- CAPA 3: APLICACIÓN / SERVICIOS -->
    <!-- ================================================= -->

    <rect x="30" y="540"
          width="1540" height="205"
          rx="17"
          fill="#f6f2fb"
          stroke="#e2d8ef"
          stroke-width="1.5"/>

    <circle cx="70" cy="575" r="21" fill="#57328d"/>

    <text x="70" y="575" class="numero">3</text>

    <text x="105" y="582"
          class="capa-titulo"
          fill="#583d86">
        Capa de aplicación / servicios
    </text>


    <!-- API REST -->

    <rect class="caja"
          x="65" y="600"
          width="675" height="110"
          stroke="#a58ac7"/>

    <text x="402" y="630" class="caja-titulo">
        API REST — Node.js 20 + Express 4
    </text>

    <text x="402" y="657" class="caja-texto">
        Autenticación · Zod · Helmet/CSP · CSRF · CORS
    </text>

    <text x="402" y="680" class="caja-texto">
        Rate limit · gestión de sesiones
    </text>

    <text x="402" y="699" class="caja-secundario">
        Escucha en 127.0.0.1:3000 · acceso interno, no expuesta a Internet
    </text>


    <!-- Proxy inverso -->

    <rect class="caja"
          x="860" y="600"
          width="675" height="110"
          stroke="#a58ac7"/>

    <text x="1197" y="630" class="caja-titulo">
        Proxy inverso con TLS (IIS / Nginx / Caddy)
    </text>

    <text x="1197" y="657" class="caja-texto">
        Termina HTTPS en 443 y aplica cabeceras de seguridad
    </text>

    <text x="1197" y="680" class="caja-texto">
        Reenvía las solicitudes hacia la API local
    </text>

    <text x="1197" y="699" class="caja-secundario">
        Opcional en desarrollo · obligatorio en producción
    </text>


    <!-- Nota de comunicación entre proxy y API -->

    <text x="800" y="730"
          text-anchor="middle"
          font-size="12"
          fill="#614a83">
        Comunicación interna: proxy inverso → API REST
    </text>



    <!-- ================================================= -->
    <!-- FLUJO DE APLICACIÓN HACIA BASE DE DATOS -->
    <!-- ================================================= -->

    <line x1="325" y1="710"
          x2="325" y2="830"
          stroke="#1768b3"
          stroke-width="3"
          marker-end="url(#arrowBlue)"/>

    <text x="345" y="763"
          class="flujo-texto"
          fill="#1768b3">
        SQL parametrizado
    </text>

    <text x="345" y="785"
          class="flujo-secundario"
          fill="#1768b3">
        Usuario app_backend (rol_app)
    </text>



    <!-- ================================================= -->
    <!-- CAPA 4: DATOS Y OPERACIÓN -->
    <!-- ================================================= -->

    <rect x="30" y="770"
          width="1540" height="165"
          rx="17"
          fill="#fff7ed"
          stroke="#f0dfc7"
          stroke-width="1.5"/>

    <circle cx="70" cy="805" r="21" fill="#b65b13"/>

    <text x="70" y="805" class="numero">4</text>

    <text x="105" y="812"
          class="capa-titulo"
          fill="#925017">
        Capa de datos y operación
    </text>


    <!-- Base de datos PostgreSQL -->

    <rect class="caja"
          x="65" y="830"
          width="690" height="85"
          stroke="#d4a34f"/>

    <text x="410" y="859" class="caja-titulo">
        PostgreSQL 16 — infra_red_db · esquema infra
    </text>

    <text x="410" y="887" class="caja-texto">
        Inventario · usuarios y roles · sesiones · mantenimientos
    </text>

    <text x="410" y="906" class="caja-secundario">
        ACL y pruebas · auditoría inmutable
    </text>


    <!-- Flujo de respaldo -->

    <line x1="755" y1="872"
          x2="840" y2="872"
          stroke="#475569"
          stroke-width="3"
          marker-end="url(#arrowDark)"/>


    <!-- Copias de seguridad -->

    <rect class="caja"
          x="840" y="830"
          width="695" height="85"
          stroke="#d4a34f"/>

    <text x="1187" y="859" class="caja-titulo">
        Copias de seguridad cifradas (GPG) + SHA-256
    </text>

    <text x="1187" y="887" class="caja-texto">
        Copia diaria · retención de 30 días
    </text>

    <text x="1187" y="906" class="caja-secundario">
        Restauración trimestral · almacenamiento externo
    </text>



    <!-- ================================================= -->
    <!-- LEYENDA -->
    <!-- ================================================= -->

    <rect x="260" y="950"
          width="1080" height="40"
          rx="10"
          fill="#ffffff"
          stroke="#a9bacb"
          stroke-width="1.5"/>

    <text x="290" y="976"
          font-size="15"
          font-weight="700"
          fill="#243c56">
        LEYENDA:
    </text>


    <!-- Azul -->

    <line x1="410" y1="970"
          x2="465" y2="970"
          stroke="#1768b3"
          stroke-width="3"
          marker-end="url(#arrowBlue)"/>

    <text x="480" y="976" class="leyenda-texto">
        Estación / API / BD
    </text>


    <!-- Verde -->

    <line x1="675" y1="970"
          x2="730" y2="970"
          stroke="#21804c"
          stroke-width="3"
          marker-end="url(#arrowGreen)"/>

    <text x="745" y="976" class="leyenda-texto">
        Acceso SQL administrativo
    </text>


    <!-- Naranja -->

    <line x1="990" y1="970"
          x2="1045" y2="970"
          stroke="#d17a00"
          stroke-width="3"
          marker-end="url(#arrowOrange)"/>

    <text x="1060" y="976" class="leyenda-texto">
        Herramientas ACL
    </text>


    <!-- Gris -->

    <line x1="1225" y1="970"
          x2="1260" y2="970"
          stroke="#475569"
          stroke-width="3"
          marker-end="url(#arrowDark)"/>

</svg>

</div>

</body>
</html>
