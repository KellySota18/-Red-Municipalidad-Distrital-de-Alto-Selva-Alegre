
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagrama de despliegue</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    background: #f1f5f9;
    font-family: "Segoe UI", Arial, sans-serif;
}

.wrap {
    width: 100%;
    max-width: 1600px;
    margin: auto;
    padding: 28px;
    background: white;
    overflow-x: auto;
}

.title {
    font-size: 32px;
    font-weight: 700;
    color: #12345a;
    margin-bottom: 5px;
}

.sub {
    font-size: 16px;
    color: #52677e;
    margin-bottom: 25px;
}

svg {
    display: block;
    width: 100%;
    height: auto;
    min-width: 1000px;
}

text {
    font-family: "Segoe UI", Arial, sans-serif;
}

.section-title {
    font-size: 18px;
    font-weight: 700;
}

.card-title {
    font-size: 19px;
    font-weight: 700;
    fill: #102d4e;
}

.card-text {
    font-size: 14px;
    fill: #385775;
}

.card-small {
    font-size: 12px;
    fill: #60758a;
}

.connection {
    font-size: 13px;
    font-weight: 600;
}
</style>
</head>

<body>
<div class="wrap">

    <div class="title">Diagrama de despliegue</div>
    <div class="sub">
        Sistema de Inventario y Seguridad de Red ·
        despliegue local y en servidor institucional · v1.0
    </div>

<svg viewBox="0 0 1600 1000"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     aria-label="Diagrama de despliegue del sistema de inventario y seguridad de red">

<defs>
    <marker id="blueArrow" markerWidth="12" markerHeight="12"
            refX="10" refY="6" orient="auto">
        <path d="M0 0 L12 6 L0 12 Z" fill="#1f6fb2"/>
    </marker>

    <marker id="purpleArrow" markerWidth="12" markerHeight="12"
            refX="10" refY="6" orient="auto">
        <path d="M0 0 L12 6 L0 12 Z" fill="#6045a5"/>
    </marker>

    <marker id="greenArrow" markerWidth="12" markerHeight="12"
            refX="10" refY="6" orient="auto">
        <path d="M0 0 L12 6 L0 12 Z" fill="#23804e"/>
    </marker>

    <marker id="orangeArrow" markerWidth="12" markerHeight="12"
            refX="10" refY="6" orient="auto">
        <path d="M0 0 L12 6 L0 12 Z" fill="#b76b00"/>
    </marker>
</defs>

<!-- ================= RED INSTITUCIONAL ================= -->

<rect x="25" y="20" width="1550" height="280"
      rx="20" fill="#eef6fd" stroke="#c5dced" stroke-width="2"/>

<text x="50" y="55" class="section-title" fill="#245b87">
    RED LOCAL INSTITUCIONAL (LAN / VPN)
</text>

<!-- Puesto de usuario -->
<rect x="60" y="80" width="450" height="175"
      rx="14" fill="#ffffff" stroke="#83b1d5" stroke-width="2"/>

<text x="285" y="115" text-anchor="middle" class="card-title">
    Puesto de usuario
</text>

<text x="285" y="145" text-anchor="middle" class="card-text">
    Windows 10/11 · PowerShell 7
</text>
<text x="285" y="168" text-anchor="middle" class="card-text">
    Módulo RedCli.psm1
</text>
<text x="285" y="202" text-anchor="middle" class="card-small">
    Roles: consulta / técnico / administrador
</text>
<text x="285" y="225" text-anchor="middle" class="card-small">
    Cliente ligero: sin instalación de BD
</text>

<!-- Administración de red -->
<rect x="575" y="80" width="450" height="175"
      rx="14" fill="#ffffff" stroke="#83b1d5" stroke-width="2"/>

<text x="800" y="115" text-anchor="middle" class="card-title">
    Puesto de administración de red
</text>

<text x="800" y="145" text-anchor="middle" class="card-text">
    Node.js 20 · herramientas ACL
</text>
<text x="800" y="168" text-anchor="middle" class="card-text">
    Cisco Packet Tracer (opcional)
</text>
<text x="800" y="202" text-anchor="middle" class="card-small">
    Simulador, generador de configuración
</text>
<text x="800" y="225" text-anchor="middle" class="card-small">
    Pruebas antes de aplicar en routers
</text>

<!-- DBA -->
<rect x="1090" y="80" width="450" height="175"
      rx="14" fill="#ffffff" stroke="#83b1d5" stroke-width="2"/>

<text x="1315" y="115" text-anchor="middle" class="card-title">
    Puesto del DBA
</text>

<text x="1315" y="145" text-anchor="middle" class="card-text">
    pgAdmin 4 / psql
</text>
<text x="1315" y="168" text-anchor="middle" class="card-text">
    GnuPG (Gpg4win) para respaldos
</text>
<text x="1315" y="202" text-anchor="middle" class="card-small">
    Acceso restringido por IP y credenciales
</text>
<text x="1315" y="225" text-anchor="middle" class="card-small">
    Nunca expuesto a Internet
</text>

<!-- Línea LAN -->
<line x1="70" y1="275" x2="1530" y2="275"
      stroke="#83b1d5" stroke-width="5" stroke-linecap="round"/>

<rect x="565" y="258" width="470" height="32"
      rx="16" fill="#ffffff" stroke="#83b1d5" stroke-width="1.5"/>

<text x="800" y="279" text-anchor="middle"
      font-size="13" font-weight="700" fill="#245b87">
    HTTPS 443 / SQL 5432 (solo red administrativa)
</text>

<!-- ================= SERVIDOR ================= -->

<rect x="25" y="350" width="1550" height="400"
      rx="20" fill="#f5f0fc" stroke="#d7c8ed" stroke-width="2"/>

<text x="50" y="385" class="section-title" fill="#6045a5">
    SERVIDOR INSTITUCIONAL (Windows Server 2019/2022 o Linux)
</text>

<!-- Proxy -->
<rect x="60" y="420" width="450" height="260"
      rx="14" fill="#ffffff" stroke="#a996cf" stroke-width="2"/>

<rect x="60" y="420" width="450" height="48"
      rx="14" fill="#e9e1f8"/>

<text x="285" y="451" text-anchor="middle" class="card-title">
    Proxy inverso / servidor web
</text>

<text x="285" y="495" text-anchor="middle" class="card-text">
    IIS · Nginx · Caddy
</text>
<text x="285" y="521" text-anchor="middle" class="card-text">
    TLS 1.2/1.3 · certificado válido
</text>
<text x="285" y="547" text-anchor="middle" class="card-text">
    Puerto público: 443
</text>
<text x="285" y="581" text-anchor="middle" class="card-small">
    Cabeceras de seguridad
</text>
<text x="285" y="605" text-anchor="middle" class="card-small">
    TRUST_PROXY=1
</text>
<text x="285" y="639" text-anchor="middle" class="card-small">
    Redirige a 127.0.0.1:3000
</text>

<!-- Aplicación -->
<rect x="575" y="420" width="450" height="260"
      rx="14" fill="#ffffff" stroke="#a996cf" stroke-width="2"/>

<rect x="575" y="420" width="450" height="48"
      rx="14" fill="#e9e1f8"/>

<text x="800" y="451" text-anchor="middle" class="card-title">
    Servicio de aplicación
</text>

<text x="800" y="495" text-anchor="middle" class="card-text">
    Node.js 20 LTS + Express 4
</text>
<text x="800" y="521" text-anchor="middle" class="card-text">
    API REST · puerto 3000
</text>
<text x="800" y="547" text-anchor="middle" class="card-text">
    Escucha solo en 127.0.0.1
</text>
<text x="800" y="581" text-anchor="middle" class="card-small">
    Servicio Windows (NSSM / Task Scheduler)
</text>
<text x="800" y="605" text-anchor="middle" class="card-small">
    o systemd en Linux
</text>
<text x="800" y="639" text-anchor="middle" class="card-small">
    Variables en .env (fuera de Git)
</text>

<!-- Base de datos -->
<rect x="1090" y="420" width="450" height="260"
      rx="14" fill="#ffffff" stroke="#c7a96b" stroke-width="2"/>

<rect x="1090" y="420" width="450" height="48"
      rx="14" fill="#fff0d5"/>

<text x="1315" y="451" text-anchor="middle" class="card-title">
    Motor de base de datos
</text>

<text x="1315" y="495" text-anchor="middle" class="card-text">
    PostgreSQL 16
</text>
<text x="1315" y="521" text-anchor="middle" class="card-text">
    Puerto 5432 · solo localhost
</text>
<text x="1315" y="547" text-anchor="middle" class="card-text">
    Base: infra_red_db · esquema: infra
</text>
<text x="1315" y="581" text-anchor="middle" class="card-small">
    Roles: postgres, rol_app, rol_lectura
</text>
<text x="1315" y="605" text-anchor="middle" class="card-small">
    RLS · auditoría · bcrypt · cifrado TLS opcional
</text>
<text x="1315" y="639" text-anchor="middle" class="card-small">
    Datos y WAL en disco local del servidor
</text>

<!-- Conexiones internas -->
<line x1="510" y1="550" x2="575" y2="550"
      stroke="#6045a5" stroke-width="4"
      marker-end="url(#purpleArrow)"/>

<rect x="505" y="510" width="75" height="28"
      rx="14" fill="#ffffff" stroke="#a996cf"/>

<text x="542" y="529" text-anchor="middle"
      font-size="12" font-weight="600" fill="#6045a5">
    HTTP local
</text>

<line x1="1025" y1="550" x2="1090" y2="550"
      stroke="#23804e" stroke-width="4"
      marker-end="url(#greenArrow)"/>

<rect x="1020" y="510" width="75" height="28"
      rx="14" fill="#ffffff" stroke="#7dbb97"/>

<text x="1057" y="529" text-anchor="middle"
      font-size="12" font-weight="600" fill="#23804e">
    SQL 5432
</text>

<!-- Conexiones LAN a servidor -->
<line x1="285" y1="275" x2="285" y2="420"
      stroke="#1f6fb2" stroke-width="4"
      marker-end="url(#blueArrow)"/>

<rect x="300" y="315" width="110" height="28"
      rx="14" fill="#ffffff" stroke="#83b1d5"/>

<text x="355" y="334" text-anchor="middle"
      class="connection" fill="#1f6fb2">
    HTTPS 443
</text>

<line x1="800" y1="275" x2="800" y2="420"
      stroke="#b76b00" stroke-width="3"
      stroke-dasharray="8 6"
      marker-end="url(#orangeArrow)"/>

<rect x="815" y="315" width="190" height="28"
      rx="14" fill="#ffffff" stroke="#e3bd7c"/>

<text x="910" y="334" text-anchor="middle"
      class="connection" fill="#b76b00">
    Resultados/ACL (opcional)
</text>

<line x1="1315" y1="275" x2="1315" y2="420"
      stroke="#23804e" stroke-width="3"
      stroke-dasharray="8 6"
      marker-end="url(#greenArrow)"/>

<rect x="1330" y="315" width="210" height="28"
      rx="14" fill="#ffffff" stroke="#7dbb97"/>

<text x="1435" y="334" text-anchor="middle"
      class="connection" fill="#23804e">
    pgAdmin 5432 (restringido)
</text>

<!-- ================= ALMACENAMIENTO ================= -->

<rect x="25" y="800" width="1550" height="175"
      rx="20" fill="#fff8ef" stroke="#efdcc0" stroke-width="2"/>

<text x="50" y="835" class="section-title" fill="#8a5b1e">
    ALMACENAMIENTO Y CONTINUIDAD
</text>

<!-- Copia local -->
<rect x="60" y="855" width="450" height="80"
      rx="12" fill="#ffffff" stroke="#c7a96b" stroke-width="2"/>

<text x="285" y="889" text-anchor="middle"
      font-size="15" fill="#7a5a2a">
    Copia cifrada GPG + SHA-256
</text>
<text x="285" y="913" text-anchor="middle"
      font-size="14" fill="#7a5a2a">
    C:\backups
</text>

<!-- Copia externa -->
<rect x="575" y="855" width="450" height="80"
      rx="12" fill="#ffffff" stroke="#c7a96b" stroke-width="2"/>

<text x="800" y="889" text-anchor="middle"
      font-size="15" fill="#7a5a2a">
    Copia externa: otro disco
</text>
<text x="800" y="913" text-anchor="middle"
      font-size="14" fill="#7a5a2a">
    o nube cifrada
</text>

<!-- Clave privada -->
<rect x="1090" y="855" width="450" height="80"
      rx="12" fill="#ffffff" stroke="#c7a96b" stroke-width="2"/>

<text x="1315" y="889" text-anchor="middle"
      font-size="15" fill="#7a5a2a">
    Clave privada GPG fuera del servidor
</text>
<text x="1315" y="913" text-anchor="middle"
      font-size="14" fill="#7a5a2a">
    Prueba trimestral
</text>

<!-- Backup -->
<line x1="1315" y1="680" x2="1315" y2="855"
      stroke="#b76b00" stroke-width="3"
      stroke-dasharray="8 6"
      marker-end="url(#orangeArrow)"/>

<rect x="1330" y="730" width="190" height="30"
      rx="15" fill="#ffffff" stroke="#e3bd7c"/>

<text x="1425" y="750" text-anchor="middle"
      class="connection" fill="#b76b00">
    pg_dump diario 02:00
</text>

</svg>
</div>
</body>
</html>
